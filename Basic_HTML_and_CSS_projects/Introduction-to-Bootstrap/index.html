<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">

    <title>Introduction to Bootstrap</title>
    <style>
    .beach-image {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }
</style>
</head>

<body>

    <h1>Introduction to Bootstrap</h1>

    <div class="container">
        <div class="row">

            <div class="col">
                <img src="images/beach-1.jpg" class="beach-image" alt="Beach 1">
            </div>

            <div class="col">
                <img src="images/beach-2.jpg" class="beach-image" alt="Beach 2">
            </div>

            <div class="col">
                <img src="images/beach-3.jpg" class="beach-image" alt="Beach 3">
            </div>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="bootstrap-5.1.3-dist/js/bootstrap.bundle.js"></script>

</body>

</html>
